[project]
name = "paludoro"
version = "0.1.0"
description = "A productivity symbiote combining virtual pets and Pomodoro focus sessions."
readme = "README.md"
license = { text = "0BSD" }
authors = [
  { name = "paprika-bot", email = "sockpaprika-git@intrawake.com" }
]
requires-python = ">=3.11"
dependencies = [
    "sxpb @ git+https://github.com/sxproto/sxpb-py@04fbc53342cb7c7dd75166be955253711966f5e2",
    "sxpb-llm[async] @ git+https://github.com/intrawake/sxpb-llm.git@2ae840fc6d9856ab235ce91a1b632a5d30acabf8",
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-logging",
    "opentelemetry-exporter-otlp",
    "httpx2>=2.5.0",
]

[project.urls]
Homepage = "https://github.com/intrawake/paludoro"
Repository = "https://github.com/intrawake/paludoro"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src", "."]
testpaths = ["test"]

[tool.pdm.scripts]
chat = { shell = "PYTHONPATH=src python3 src/paludoro/chat.py" }
test = "pytest -q"
server = { shell = "PYTHONPATH=src python3 src/paludoro/server.py" }
web-build = { shell = "cd web && npm run build" }

web-watch = { shell = "cd web && npx vite build --watch --outDir ../dist --emptyOutDir" }
web-install = { shell = "cd web && npm install" }
check-format = "ruff check"
check-type = "ty check"
tidy = { shell = "ruff format src test && ruff check src test --fix && cd web && npx prettier --write '**/*.{ts,html}'" }
lint = {composite = ["check-format", "check-type"]}
tidytest = {composite = ["test", "tidy", "lint"]}

[tool.ty.environment]
root = ["src", "test", "."]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff",
    "ty",
    "psutil>=7.2.2",
    "httpx2>=0.28.1",
    "pytest-asyncio>=1.3.0",
]
