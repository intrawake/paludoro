[project]
name = "paludoro"
version = "0.1.0"
description = "A productivity symbiote combining virtual pets and Pomodoro focus sessions."
readme = "README.md"
license = { text = "0BSD" }
authors = [
  { name = "paprika-bot", email = "sockpaprika-git@intrawake.com" }
]
requires-python = ">=3.11"
dependencies = [
    "sxpb @ git+https://github.com/sxproto/sxpb-py@539ea1b3fde70abe6c1c2f5188290e51a577d204",
    "sxpb-llm[async] @ git+https://github.com/intrawake/sxpb-llm.git@56dd2284d690ba1214485e089105d074a78fe066",
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-logging",
    "opentelemetry-exporter-otlp",
    "httpx2>=2.5.0",
]

[project.urls]
Homepage = "https://github.com/intrawake/paludoro"
Repository = "https://github.com/intrawake/paludoro"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff==0.15.22",
    "ty==0.0.64",
    "psutil>=7.2.2",
    "httpx2>=0.28.1",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
addopts = [
    "-q",
    "--import-mode=importlib",
]
pythonpath = ["src", "."]
testpaths = ["test"]

[tool.pdm.scripts]
chat = { shell = "PYTHONPATH=src python3 src/paludoro/chat.py" }
test = "pytest"
server = { shell = "PYTHONPATH=src python3 src/paludoro/server.py" }
web-build = { shell = "cd web && npm run build" }

web-watch = { shell = "cd web && npx vite build --watch --outDir ../dist --emptyOutDir" }
web-install = { shell = "cd web && npm install" }
check-format = "ruff check"
check-type = "ty check"
lint-sxpb = "sxpb-lint --ignore-file .gitignore"
tidy = { shell = "ruff format src test && ruff check src test --fix && sxpb-tidy --ignore-file .gitignore && cd web && npx prettier --write '**/*.{ts,html}'" }
lint = {composite = ["check-format", "check-type", "lint-sxpb"]}
tidytest = {composite = ["tidy", "lint", "test"]}

[tool.ty.environment]
root = ["src", "test", "."]
